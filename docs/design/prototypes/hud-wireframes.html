<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Совиный Холм — схемы экранов (ландшафт, 800×360 dp)</title>
<style>
  body { background:#14191e; color:#EEE4CF; font-family: "PT Sans", Arial, sans-serif; margin:24px; }
  h2 { font-weight:600; margin:28px 0 8px; }
  p { max-width:820px; color:#c9c0ad; }
  svg { display:block; width:100%; max-width:960px; border:1px solid #3a4651; }
  .scene { fill:#1E2A33; }
  .btn { fill:#24313F; stroke:#C08F45; stroke-width:2; }
  .btnx { fill:none; stroke:#C08F45; stroke-width:2; stroke-dasharray:5 4; }
  .zone { fill:none; stroke:#93A6AB; stroke-width:1; stroke-dasharray:3 3; }
  .lbl { fill:#EEE4CF; font-size:11px; }
  .sm { fill:#93A6AB; font-size:9px; }
  .mark { fill:none; stroke:#EEE4CF; stroke-width:2; }
  .paper { fill:#EEE4CF; }
  .ink { fill:#24313F; font-size:11px; }
</style>
</head>
<body>
<p>Схемы раскладки, не графика. Единица — dp, экран телефона 20:9 в ландшафте (800×360). Пунктир серо-голубой — безопасный отступ 16 dp. Все кнопки не меньше 48 dp.</p>

<h2>1. Игровой экран (панорама)</h2>
<svg viewBox="0 0 800 360">
  <rect class="scene" x="0" y="0" width="800" height="360"/>
  <rect class="zone" x="16" y="16" width="768" height="328"/>
  <!-- marks -->
  <ellipse class="mark" cx="300" cy="270" rx="34" ry="10"/><path class="mark" d="M292 268 l8 -6 l8 6"/>
  <text class="sm" x="262" y="296">метка перехода (48 dp зона)</text>
  <rect class="mark" x="520" y="120" width="40" height="70"/><ellipse class="mark" cx="540" cy="200" rx="26" ry="7"/>
  <text class="sm" x="500" y="222">дверь: метка + арка</text>
  <circle cx="420" cy="160" r="22" fill="none" stroke="#F2C98A" stroke-width="2" stroke-dasharray="2 3"/>
  <text class="sm" x="380" y="196">объект (Л: мерцание)</text>
  <!-- HUD -->
  <rect class="btn" x="16" y="16" width="48" height="48" rx="6"/><text class="lbl" x="33" y="45">≡</text>
  <text class="sm" x="70" y="34">Меню (редко)</text>
  <rect class="btn" x="728" y="16" width="56" height="56" rx="28"/><text class="lbl" x="738" y="48">Мысль</text>
  <circle cx="744" cy="80" r="3" fill="#EEE4CF"/><circle cx="756" cy="80" r="3" fill="#EEE4CF"/><circle cx="768" cy="80" r="3" fill="none" stroke="#EEE4CF"/>
  <text class="sm" x="640" y="34">Л: всегда, Н: заряды, С: нет</text>
  <rect class="btnx" x="16" y="156" width="48" height="48" rx="6"/><text class="lbl" x="22" y="185">Лупа</text>
  <text class="sm" x="70" y="184">только Н</text>
  <rect x="220" y="262" width="360" height="40" rx="4" fill="#1E2A33" fill-opacity=".85" stroke="#3a4651"/>
  <text class="lbl" x="232" y="287">Субтитр: «Часы стоят. Странно, их всегда заводили».</text>
  <rect class="btn" x="660" y="288" width="56" height="56" rx="6"/><text class="lbl" x="667" y="320">Сумка</text>
  <rect class="btn" x="728" y="288" width="56" height="56" rx="6"/><text class="lbl" x="730" y="320">Блокнот</text>
  <text class="sm" x="600" y="280">частые действия — под правым пальцем</text>
</svg>

<h2>2. Сумка открыта (панорама остаётся активной)</h2>
<svg viewBox="0 0 800 360">
  <rect class="scene" x="0" y="0" width="800" height="360"/>
  <rect x="0" y="272" width="800" height="88" fill="#3A2A20"/>
  <g>
    <rect class="btn" x="24" y="284" width="64" height="64" rx="4" stroke-width="3"/><text class="sm" x="30" y="320">сова (закр.)</text>
    <rect class="btn" x="96" y="276" width="64" height="64" rx="4"/><text class="sm" x="104" y="312">выбран ↑</text>
    <rect class="btn" x="168" y="284" width="64" height="64" rx="4"/>
    <rect class="btn" x="240" y="284" width="64" height="64" rx="4"/>
    <rect class="btn" x="312" y="284" width="64" height="64" rx="4"/>
    <rect class="btn" x="528" y="292" width="56" height="48" rx="4"/><text class="lbl" x="533" y="320">Соед.</text>
  </g>
  <text class="lbl" x="96" y="262">Ключ с зубцом — тап ещё раз: осмотр; тащить: применить</text>
  <circle cx="430" cy="140" r="26" fill="none" stroke="#EEE4CF" stroke-width="2"/>
  <rect x="412" y="78" width="36" height="36" rx="4" fill="#C08F45" fill-opacity=".8"/>
  <text class="sm" x="460" y="100">предмет над пальцем (+40 dp), цель обведена</text>
  <rect class="btn" x="660" y="288" width="56" height="56" rx="6"/><text class="lbl" x="667" y="320">Сумка</text>
  <rect class="btn" x="728" y="288" width="56" height="56" rx="6"/><text class="lbl" x="730" y="320">Блокнот</text>
</svg>

<h2>3. Экран головоломки (кольца)</h2>
<svg viewBox="0 0 800 360">
  <rect x="0" y="0" width="800" height="360" fill="#3A2A20"/>
  <circle cx="400" cy="170" r="140" fill="none" stroke="#C08F45" stroke-width="40" stroke-opacity=".5"/>
  <circle cx="400" cy="170" r="90" fill="none" stroke="#C08F45" stroke-width="40" stroke-opacity=".7"/>
  <circle cx="400" cy="170" r="40" fill="#C08F45"/>
  <text class="sm" x="560" y="80">кольцевая зона ≥ 48 dp, шаг 45°, щелчок + 10 мс вибрации</text>
  <rect class="btn" x="16" y="152" width="48" height="48" rx="6"/><text class="lbl" x="28" y="181">↺</text>
  <text class="sm" x="16" y="214">Сброс</text>
  <rect class="btn" x="16" y="288" width="56" height="56" rx="6"/><text class="lbl" x="22" y="320">‹ Назад</text>
  <rect class="btn" x="728" y="16" width="56" height="56" rx="6"/><text class="lbl" x="732" y="48">Снимок</text>
  <rect class="btn" x="660" y="288" width="56" height="56" rx="6"/><text class="lbl" x="667" y="320">Сумка</text>
  <rect class="btn" x="728" y="288" width="56" height="56" rx="6"/><text class="lbl" x="730" y="320">Блокнот</text>
  <rect class="zone" x="300" y="304" width="200" height="40"/><text class="sm" x="318" y="328">зона субтитров — без важного</text>
</svg>

<h2>4. Выбор сложности</h2>
<svg viewBox="0 0 800 360">
  <rect class="scene" x="0" y="0" width="800" height="360"/>
  <g>
    <rect class="paper" x="40" y="40" width="220" height="230" rx="6"/>
    <text class="ink" x="56" y="70" font-size="14">Лёгкий</text><text class="ink" x="56" y="92">[лампа]</text>
    <rect class="paper" x="290" y="34" width="220" height="242" rx="6" stroke="#C08F45" stroke-width="4"/>
    <rect x="296" y="40" width="208" height="230" rx="4" fill="none" stroke="#24313F" stroke-width="1.5"/>
    <text class="ink" x="306" y="70" font-size="14">Нормальный ✓</text><text class="ink" x="306" y="92">[свеча]</text>
    <rect class="paper" x="540" y="40" width="220" height="230" rx="6" fill-opacity=".7"/>
    <text class="ink" x="556" y="70" font-size="14">Сложный</text><text class="ink" x="556" y="92">[луна в облаке]</text>
  </g>
  <text class="lbl" x="40" y="306">Сложность нельзя изменить во время игры. Сменить её можно, только начав заново.</text>
  <rect class="btn" x="624" y="288" width="160" height="56" rx="6"/><text class="lbl" x="660" y="320">Начать дело</text>
  <rect class="btn" x="16" y="288" width="56" height="56" rx="6"/><text class="lbl" x="22" y="320">‹ Назад</text>
</svg>
</body>
</html>
