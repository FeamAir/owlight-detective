  - { id: MARTHA,   name_key: speaker.MARTHA,   facts: [DLG-INTRO-005, DLG-INTRO-007, DLG-INTRO-009, DLG-INTRO-011, DLG-INTRO-016] }
  - { id: VERONICA, name_key: speaker.VERONICA, facts: [DLG-INTRO-019, DLG-INTRO-021] }
  - { id: FELIX,    name_key: speaker.FELIX,    facts: [DLG-INTRO-023, DLG-INTRO-024, DLG-INTRO-025, DLG-INTRO-027] }
