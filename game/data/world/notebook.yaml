  - { id: G-02, text: goal.g02, opens_on: vp.VP-GATE-2,       closes_on: solved.PZ-GATE-03, main: true }
  - { id: G-03, text: goal.g03, opens_on: solved.PZ-GATE-03,  closes_on: ev.EV-SLICE-END, main: true }
  - { id: S-01, text: goal.s01, opens_on: line.DLG-INTRO-028, closes_on: solved.PZ-PIER-01 }
  - { id: S-02, text: goal.s02, opens_on: solved.PZ-PIER-01,  closes_on: solved.PZ-GATE-02 }
  - { id: S-03, text: goal.s03, opens_on: solved.PZ-PIER-01,  closes_on: solved.PZ-ALLEY-01 }
people:                                  # engine: карточки «Дело» → люди
