# Формат — slice-01-spec.md 8. Поля action.kind: closeup, puzzle, line, document, locked, slice_boundary.
# engine: label_key — подпись зоны в отладочном режиме и в списке «неосмотренного».
hotspots:
  - id: HS-GATE-PILLARS
    vp: VP-GATE-1
    pos: { yaw: 0, pitch: 6, size_deg: 63.3 }
    action: { kind: closeup, asset: cu_gate_pillars }
    on_first: { line: DLG-GATE-001, set: [seen.pillars],
                autosnap: { easy: SNAP-PILLARS }, autocode: { easy: CODE-PILLARS-ORDER } }   # engine: ID снимка вместо true
  - id: HS-GATE-LOCK
    vp: VP-GATE-1
    pos: { yaw: 36.5, pitch: -2.3, size_deg: 4.8 }
    action: { kind: puzzle, puzzle: PZ-GATE-01 }
    on_first: { line: DLG-GATE-002, set: [seen.lock_engraving] }
    after_solved: { kind: exit, to: VP-GATE-2 }
  - id: HS-GATE-ROAD
    vp: VP-GATE-1
    pos: { yaw: 180, pitch: -7.1, size_deg: 39 }
    action: { kind: line, line: DLG-GATE-003 }
  - id: HS-GATE-KEYBOX
    vp: VP-GATE-2
    pos: { yaw: 0, pitch: -2.6, size_deg: 19.4 }
    action: { kind: puzzle, puzzle: PZ-GATE-03 }
    on_first: { line: DLG-GATE-008, set: [seen.keybox_tag],
                tutorial_if: { not_flag: seen.ticket, ui: UI-TUT-06 } }
  - id: HS-GATE-WEATHERREC
    vp: VP-GATE-2
    pos: { yaw: 50.5, pitch: -21.3, size_deg: 19.6 }
    action:
      kind: closeup
      asset: cu_gate_weatherrec
      autosnap: { all: SNAP-WEATHER-TAPE }
      states:
        - { when: { not_flag: solved.PZ-PIER-01 }, line: DLG-GATE-006 }
        - { when: { flag: solved.PZ-PIER-01 }, line_once: DLG-GATE-010, open_puzzle: PZ-GATE-02 }
  - id: HS-GATE-WEATHERLOG
    vp: VP-GATE-2
    pos: { yaw: 34.3, pitch: -21.1, size_deg: 13.7 }
    action: { kind: document, doc: DOC-WEATHER-LOG }
    on_first: { lines: [DLG-GATE-007, DLG-GLASS-001] }
  - id: HS-GATE-RECORDER
    vp: VP-GATE-2
    pos: { yaw: 307.7, pitch: -10.6, size_deg: 10.1 }
    action: { kind: closeup, asset: cu_gate_recorder }
    on_first: { line: DLG-GATE-005, give: [CL-GATE-2310], autosnap: { all: SNAP-GATE-TAPE },
                question: Q-GATE-2310, long_link: { id: LL-5, role: source } }
  - id: HS-GATE-WALLCLOCK
    vp: VP-GATE-2
    only_if: difficulty.hard
    pos: { yaw: 104.4, pitch: 15.3, size_deg: 17 }
    action: { kind: line, line: DLG-GATE-011 }
  - id: HS-ALLEY-FOUNTAIN
    vp: VP-ALLEY-1
    pos: { yaw: 0, pitch: -7.1, size_deg: 46.5 }
    action: { kind: closeup, asset: cu_alley_fountain, subviews: [bowl_owl, bowl_key, bowl_gear, bowl_moon] }
    on_first: { line: DLG-ALLEY-002, set: [seen.fountain_levels],
                autosnap: { easy: SNAP-FOUNTAIN }, autocode: { easy: CODE-FOUNTAIN-LEVELS } }   # engine: ID снимка вместо true
  - id: HS-ALLEY-FRONTDOOR
    vp: VP-ALLEY-1
    pos: { yaw: 0, pitch: 1.2, size_deg: 4 }
    action: { kind: slice_boundary }        # см. slice.boundary_exits
  - id: HS-ALLEY-BARREL
    vp: VP-ALLEY-1
    pos: { yaw: 322.9, pitch: -6.9, size_deg: 7.6 }
    action: { kind: closeup, asset: cu_alley_barrel }
    on_first: { line: DLG-ALLEY-003, question: { id: Q-BARREL, levels: [easy, normal] } }
  - id: HS-ALLEY-TOWERDOOR
    vp: VP-ALLEY-1
    pos: { yaw: 55.1, pitch: -2.1, size_deg: 8.5 }
    action: { kind: locked, gate: GT-P13, line: DLG-ALLEY-004, question: Q-TOWER }
  - id: HS-ALLEY-TERRACE                    # P3, можно отключить
    vp: VP-ALLEY-1
    optional: true
    pos: { yaw: 81.6, pitch: 0.3, size_deg: 10.2 }
    action: { kind: locked, gate: GT-P19, line: DLG-ALLEY-012, asset: cu_alley_terrace }
  - id: HS-ALLEY-GARDENGATE
    vp: VP-ALLEY-1
    pos: { yaw: 110.5, pitch: -2.3, size_deg: 8.2 }
    action: { kind: slice_boundary }
  - id: HS-ALLEY-GRAVEL
    vp: VP-ALLEY-1
    pos: { yaw: 264.1, pitch: -20.9, size_deg: 29.4 }
    # engine: visible_from (спецификация: «видно из VP-PIER-1») снят — в 3D-макете гравий развилки скрыт склоном
    #         и из VP-PIER-1, и с тропы (VP-PATH-1); путь к нему — метка «Наверх, к фонтану».
    action:
      states:
        - { when: { not_flag: solved.PZ-PIER-01 }, kind: line, line: DLG-ALLEY-009 }
        - { when: { flag: solved.PZ-PIER-01 }, kind: puzzle, puzzle: PZ-ALLEY-01 }
  - id: HS-PIER-SCENE
    vp: VP-PIER-1
    pos: { yaw: 0, pitch: -5.9, size_deg: 46.8 }
    action: { kind: puzzle, puzzle: PZ-PIER-01 }
  - id: HS-PIER-SHED
    vp: VP-PIER-1
    pos: { yaw: 292.9, pitch: -10.3, size_deg: 12.9 }
    action: { kind: locked, gate: GT-P06, line: DLG-PIER-002, question: Q-SHED }
