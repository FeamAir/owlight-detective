PZ-GATE-02:
  easy:
    tape: { from: "13 Oct 18:00", to: "15 Oct 10:00", hour_labels_every: 3, legend: drop_icon,
            segments: [ { id: day14, kind: dry, from: "14 Oct 06:00", to: "14 Oct 18:00" },
                        { id: night, kind: rain, from: "14 Oct 23:15", to: "15 Oct 02:00", height: high } ] }
    journal_in_pool: false
    notes: [coat_folded, hat_dry, top_dry, hem_damp, puddle]
    fragments_marked: true
    answer: { rain: [night], items_any: [top_dry, hat_dry], conclusion: D }
  normal:
    tape: { from: "12 Oct 00:00", to: "15 Oct 10:00", hour_labels_every: 3, legend: journal,
            segments: [ { id: r12, kind: rain, from: "12 Oct 14:00", to: "12 Oct 16:30", height: low },
                        { id: night, kind: rain, from: "14 Oct 23:15", to: "15 Oct 02:00", height: high } ] }
    journal: [j12_rain, j13_dry, j14_dry]
    notes: [coat_folded, hat_dry, top_dry, hem_damp, puddle, leaves_wet, bucket_full]
    answer: { rain: [night], items_any: [top_dry, hat_dry], conclusion: D }
  hard:
    tape: { from: "10 Oct 00:00", to: "15 Oct 10:00", hour_labels_every: 6, legend: journal,
            segments: [ { id: r10, kind: rain, from: "10 Oct 06:00", to: "10 Oct 09:00", height: medium },
                        { id: r12, kind: rain, from: "12 Oct 14:00", to: "12 Oct 16:30", height: low },
                        { id: night_start, kind: rain_start, at: "14 Oct 23:15" },
                        { id: night_mid,   kind: rain, from: "14 Oct 23:15", to: "15 Oct 02:00" },
                        { id: night_end,   kind: rain_end, at: "15 Oct 02:00" } ] }
    journal: [j10_rain, j11_dry, j12_rain, j13_dry, j14_dry, j14_forecast]
    notes: [coat_folded, hat_dry, top_dry, hem_damp, puddle, leaves_wet, bucket_full]
    extra_docs: [SNAP-GATE-TAPE]   # выбираемые фрагменты снимка — отметки marks_14 / marks_15 (17:30, 23:10, 08:55), все ложные
    answer: { rain: [night_end], items_any: [top_dry, hat_dry], conclusion: D }
  conclusions: [A_all_night, B_before_rain, C_during_rain, D_after_rain]
  all: { rain_end: "02:00", rain_end_words: { ru: "двух", en: "two" },   # engine: параметры LOGIC-GATE-02 / CL-RAIN
         # engine: роли фрагментов для реакций (5.4, «Обратная связь»); фрагменты ленты и журнала без роли —
         #   tape_wrong / journal, отметки ленты ворот (С) — decoy_doc
         roles: { hem_damp: hem, puddle: rain_evidence, leaves_wet: rain_evidence, bucket_full: rain_evidence,
                  coat_folded: folded, j14_forecast: decoy_doc } }
