  doc.ticket.hard:       { ru: "Железная дорога. Билет пассажирский.\n15 октября. Утренний.\nОтправление: 06:52.\nГород — Узловая: 1 ч 20 мин.\nСтоянка на Узловой: 6 мин.\nУзловая — Совиный Холм: 1 ч 22 мин.\nБилет № 0915. Вагон 3, место 24.", en: "Railway. Passenger ticket.\n15 October. Morning.\nDeparture: 06:52.\nCity — Junction: 1 h 20 min.\nStop at Junction: 6 min.\nJunction — Owl Hill: 1 h 22 min.\nTicket No. 0915. Carriage 3, seat 24." }
  doc.weather_log.easy:  { ru: "Метеожурнал. Переписано с ленты.\n12 окт.  Дождь с 14:00 до 16:30, небольшой. Ветер с озера.\n13 окт.  Сухо. Ветер с дороги. Туман до полудня.\n14 окт.  Сухо. Ветер с озера, к вечеру крепче.", en: "Weather log. Copied from the tape.\n12 Oct.  Rain 14:00 to 16:30, light. Wind off the lake.\n13 Oct.  Dry. Wind from the road. Fog till noon.\n14 Oct.  Dry. Wind off the lake, stronger by evening." }
  doc.weather_log.normal: { ru: "Метеожурнал. Переписано с ленты.\n12 окт.  Дождь с 14:00 до 16:30, небольшой. Ветер с озера.\n13 окт.  Сухо. Ветер с дороги. Туман до полудня.\n14 окт.  Сухо. Ветер с озера, к вечеру крепче.", en: "Weather log. Copied from the tape.\n12 Oct.  Rain 14:00 to 16:30, light. Wind off the lake.\n13 Oct.  Dry. Wind from the road. Fog till noon.\n14 Oct.  Dry. Wind off the lake, stronger by evening." }
  doc.weather_log.hard:  { ru: "Метеожурнал. Переписано с ленты.\n10 окт.  Дождь с 06:00 до 09:00. Ветер с дороги.\n11 окт.  Сухо. Ветер с озера.\n12 окт.  Дождь с 14:00 до 16:30, небольшой. Ветер с озера.\n13 окт.  Сухо. Ветер с дороги. Туман до полудня.\n14 окт.  Сухо. Ветер с озера, к вечеру крепче. К ночи, похоже, польёт.", en: "Weather log. Copied from the tape.\n10 Oct.  Rain 06:00 to 09:00. Wind from the road.\n11 Oct.  Dry. Wind off the lake.\n12 Oct.  Rain 14:00 to 16:30, light. Wind off the lake.\n13 Oct.  Dry. Wind from the road. Fog till noon.\n14 Oct.  Dry. Wind off the lake, stronger by evening. Looks like rain by night." }
  doc.pier_notes.easy:   { ru: "1. Пальто сложено у последней сваи.\n2. Шляпа лежит на пальто — сухая целиком.\n3. Верх пальто сухой, ворс торчит.\n4. По нижнему краю пальто — подмокшая полоса.\n5. В выемке доски — лужица.", en: "1. Coat folded by the last post.\n2. Hat on the coat — completely dry.\n3. Top of the coat dry, nap standing up.\n4. A damp band along the bottom edge.\n5. A puddle in a dip in the boards." }
  doc.pier_notes.normal: { ru: "1. Пальто сложено у последней сваи.\n2. Шляпа лежит на пальто — сухая целиком.\n3. Верх пальто сухой, ворс торчит.\n4. По нижнему краю пальто — подмокшая полоса.\n5. В выемке доски — лужица.\n6. Листья по всему настилу мокрые.\n7. Ведро под жёлобом сарая — полное до края.", en: "1. Coat folded by the last post.\n2. Hat on the coat — completely dry.\n3. Top of the coat dry, nap standing up.\n4. A damp band along the bottom edge.\n5. A puddle in a dip in the boards.\n6. Wet leaves all over the decking.\n7. Bucket under the boathouse gutter — full to the brim." }
  doc.pier_notes.hard:   { ru: "1. Пальто сложено у последней сваи.\n2. Шляпа лежит на пальто — сухая целиком.\n3. Верх пальто сухой, ворс торчит.\n4. По нижнему краю пальто — подмокшая полоса.\n5. В выемке доски — лужица.\n6. Листья по всему настилу мокрые.\n7. Ведро под жёлобом сарая — полное до края.", en: "1. Coat folded by the last post.\n2. Hat on the coat — completely dry.\n3. Top of the coat dry, nap standing up.\n4. A damp band along the bottom edge.\n5. A puddle in a dip in the boards.\n6. Wet leaves all over the decking.\n7. Bucket under the boathouse gutter — full to the brim." }
