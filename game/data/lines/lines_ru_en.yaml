# Все реплики, мысли, подсказки, показ логики и реакции на ошибку (решение №11).
# Поля: line_id, speaker_id, emotion, style (speech / thought / letter), status, text_ru, text_en, audio_ru, audio_en.
# status: approved (сценарист, spec v1.1), test, draft, needed.
# text_en: null → в сборке на EN показывается RU с пометкой [EN]. text_ru: null → [TEXT NEEDED: <id>].
#
# КАНОН ТЕКСТОВ — docs/levels/slice-01-spec.md, разделы 4 и 7.3. Тексты сюда переносит
#   python3 game/tools/sync_lines_from_spec.py
# Здесь правьте только служебные поля (говорящий, эмоция, стиль, аудио, template_ru/en для реплик-шаблонов,
# где значения зависят от уровня) — тексты text_ru/text_en перезапишутся из спецификации.
lines:
  - line_id: DLG-INTRO-001
    speaker_id: TARN
    style: letter
    status: approved
    text_ru: 'Клара,
  
      помните ярмарку и заводную сову? Вы тогда сказали, что она смотрит. Я ответил: это вы умеете смотреть.
  
      С тех пор вы научились ещё и считать. Мне нужно и то и другое.
  
      Я написал в ваше общество и просил прислать именно вас.
  
      Приезжайте пятнадцатого октября утренним поездом, билет внутри.
  
      Если меня не будет на платформе, значит, я был прав и мне не дали дождаться.
  
      Тогда не ищите меня там, где будут искать все. Ответы в доме.
  
      Сову возьмите с собой.
  
      А. Т.'
    text_en: 'Clara,
  
      do you remember the fair, and the clockwork owl? You said it was watching you. I told you that you were the one who knew how to look.
  
      Since then you have learned to count as well. I need both.
  
      I have written to your company and asked for you by name.
  
      Come on the fifteenth of October, by the morning train. The ticket is enclosed.
  
      If I am not on the platform, then I was right, and I was not allowed to wait for you.
  
      In that case, do not look for me where everyone else will. The answers are in the house.
  
      Bring the owl.
  
      A. T.'
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-002
    speaker_id: CLARA
    emotion: thoughtful
    style: thought
    status: approved
    text_ru: Двадцать шесть лет ни слова. И вдруг — билет.
    text_en: Twenty-six years without a word. And now a ticket.
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-003
    speaker_id: MARTHA
    emotion: neutral
    style: speech
    status: approved
    text_ru: Госпожа Вест? Из страхового общества?
    text_en: Miss West? From the insurance company?
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-004
    speaker_id: CLARA
    emotion: calm
    style: speech
    status: approved
    text_ru: Она самая. А где господин Тарн?
    text_en: That's me. And where is Mr Tarn?
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-005
    speaker_id: MARTHA
    emotion: upset
    style: speech
    status: approved
    text_ru: Потому я здесь, а не он. В семь утра кабинет пуст. Постель не тронута.
    text_en: That's why I'm here and he isn't. At seven this morning his study was empty. The bed hadn't been slept in.
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-006
    speaker_id: CLARA
    emotion: calm
    style: speech
    status: approved
    text_ru: Полиция знает?
    text_en: Do the police know?
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-007
    speaker_id: MARTHA
    emotion: neutral
    style: speech
    status: approved
    text_ru: 'Звонили. Инспектор говорит: старики любят гулять. Велит ждать двое суток.'
    text_en: We rang them. The inspector says old men like to wander. We're to wait two days.
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-008
    speaker_id: CLARA
    emotion: calm
    style: speech
    status: approved
    text_ru: А вы что думаете?
    text_en: And what do you think?
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-009
    speaker_id: MARTHA
    emotion: neutral
    style: speech
    status: approved
    text_ru: Сорок лет служу в этом доме. Хозяин не уходит, не допив чай.
    text_en: Forty years I've served this house. The master doesn't walk off and leave his tea.
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-010
    speaker_id: CLARA
    emotion: calm
    style: speech
    status: approved
    text_ru: Как вы меня узнали?
    text_en: How did you recognise me?
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-011
    speaker_id: MARTHA
    emotion: neutral
    style: speech
    status: approved
    text_ru: 'Вчера он показал мне газету с вашим снимком. Сказал: "Если утром меня не будет, встретишь её с поезда".'
    text_en: Yesterday he showed me a newspaper with your picture. He said, 'If I'm not here in the morning, meet her off the train.'
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-012
    speaker_id: MARTHA
    emotion: neutral
    style: speech
    status: approved
    text_ru: Я решила, шутит.
    text_en: I thought he was joking.
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-013
    speaker_id: CLARA
    emotion: thoughtful
    style: thought
    status: approved
    text_ru: Газета с моим снимком. Значит, он за мной следил.
    text_en: A newspaper with my picture. So he's been keeping an eye on me.
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-014
    speaker_id: CLARA
    emotion: calm
    style: speech
    status: approved
    text_ru: Кто ночевал в доме?
    text_en: Who stayed in the house last night?
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-015
    speaker_id: MARTHA
    emotion: neutral
    style: speech
    status: approved
    text_ru: Дочь, Вероника. Племянник, Юлиан. Доктор Корд. Барышня Ида, что пишет каталог. И секретарь, Феликс Ром.
    text_en: His daughter, Veronica. His nephew, Julian. Dr Cord. Miss Ida, who's doing the catalogue. And the secretary, Felix Rom.
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-016
    speaker_id: MARTHA
    emotion: neutral
    style: speech
    status: approved
    text_ru: Только Феликс ездил вечером в город. Вернулся последним автобусом.
    text_en: Only Felix went into town last night. He came back on the last bus.
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-028
    speaker_id: MARTHA
    emotion: neutral
    style: speech
    status: approved
    text_ru: Видите светлое на мостках? Это его пальто. Я заметила с дороги, когда ехала за вами.
    text_en: See that pale shape on the pier? That's his coat. I spotted it from the road on my way to fetch you.
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-029
    speaker_id: CLARA
    emotion: calm
    style: speech
    status: approved
    text_ru: Пусть лежит, как лежит. Я посмотрю сама.
    text_en: Let it lie where it is. I'll look at it myself.
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-017
    speaker_id: CLARA
    emotion: calm
    style: speech
    status: approved
    text_ru: Башенные часы стоят?
    text_en: Has the tower clock stopped?
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-018
    speaker_id: MARTHA
    emotion: neutral
    style: speech
    status: approved
    text_ru: Давно. Хозяин никого туда не пускает.
    text_en: Long ago. The master lets no one up there.
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-019
    speaker_id: VERONICA
    emotion: neutral
    style: speech
    status: approved
    text_ru: Марта сказала, вы из страховой. Отец не мог выбрать день удачнее.
    text_en: Martha says you're from the insurers. Father couldn't have picked a better day.
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-020
    speaker_id: CLARA
    emotion: calm
    style: speech
    status: approved
    text_ru: Он выбрал его неделю назад.
    text_en: He picked it a week ago.
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-021
    speaker_id: VERONICA
    emotion: guarded
    style: speech
    status: approved
    text_ru: Полиция считает, что он гуляет. Мне хочется в это верить.
    text_en: The police think he's out walking. I'd like to believe that.
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-022
    speaker_id: CLARA
    emotion: calm
    style: speech
    status: approved
    text_ru: Тогда помогу вам в этом убедиться. Или нет.
    text_en: Then I'll help you make sure of it. Or not.
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-023
    speaker_id: FELIX
    emotion: smile
    style: speech
    status: approved
    text_ru: Феликс Ром, секретарь. Ключи, бумаги, расписание — всё ко мне.
    text_en: Felix Rom, secretary. Keys, papers, appointments — all come to me.
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-024
    speaker_id: FELIX
    emotion: guarded
    style: speech
    status: approved
    text_ru: Страховая проверка? Странно. Хозяин мне не говорил.
    text_en: An insurance inspection? Odd. The master never mentioned it.
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-025
    speaker_id: FELIX
    emotion: smile
    style: speech
    status: approved
    text_ru: Кабинет, увы, заперт. Ключ хозяин носит с собой.
    text_en: The study is locked, I'm afraid. The master keeps the key on him.
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-027
    speaker_id: FELIX
    emotion: smile
    style: speech
    status: approved
    text_ru: Запасные — в ящике в сторожке. Но на днях хозяин сменил код ящика. Мне не сказал.
    text_en: The spares are in the key box in the gatehouse. But the master changed its code the other day. He didn't tell me.
    audio_ru: null
    audio_en: null
  - line_id: DLG-INTRO-026
    speaker_id: CLARA
    emotion: thoughtful
    style: thought
    status: approved
    text_ru: Ворота видят всех, кто уходит ночью. Начну отсюда.
    text_en: The gate sees everyone who leaves at night. I'll start here.
    audio_ru: null
    audio_en: null
  - line_id: DLG-GATE-001
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Знаки на столбах. Даже ворота здесь с характером.
    text_en: Signs on the pillars. Even the gate here has character.
    audio_ru: null
    audio_en: null
  - line_id: DLG-GATE-002
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: 'Барабаны с цифрами. Над ними гравюра: столбики с чашами.'
    text_en: 'Number drums. Above them, an engraving: little pillars with bowls.'
    audio_ru: null
    audio_en: null
  - line_id: DLG-GATE-003
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: На станцию возвращаться незачем. Всё, что мне нужно, — здесь.
    text_en: No reason to go back to the station. Everything I need is here.
    audio_ru: null
    audio_en: null
  - line_id: DLG-GATE-004
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Сторожа нет. Зато два самописца.
    text_en: No gatekeeper. Two recorders instead.
    audio_ru: null
    audio_en: null
  - line_id: DLG-GATE-005
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Ворота открывали в 23:10. Ушёл?
    text_en: The gate opened at 23:10. Did he leave?
    audio_ru: null
    audio_en: null
  - line_id: DLG-GATE-006
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Дождемер и флюгер. Лента тянется до самого утра.
    text_en: A rain gauge and a wind vane. The tape runs right up to this morning.
    audio_ru: null
    audio_en: null
  - line_id: DLG-GATE-007
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Почерк Тарна. Каждый вечер переписывал сюда ленту. Последняя запись — за четырнадцатое.
    text_en: Tarn's hand. He copied the tape out here every evening. The last entry is for the fourteenth.
    audio_ru: null
    audio_en: null
  - line_id: DLG-GLASS-001
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Мелкий почерк. Хорошо, что очки при мне. Почти лупа.
    text_en: Tiny handwriting. Good thing I have my glasses. Almost a magnifying glass.
    audio_ru: null
    audio_en: null
  - line_id: DLG-GATE-008
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: '"Для гостя с поезда". Гость с поезда — это я.'
    text_en: '''For the guest off the train.'' That would be me.'
    audio_ru: null
    audio_en: null
  - line_id: DLG-GATE-009
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Ключ с биркой "Кабинет". Тарн оставил его для меня.
    text_en: A key tagged 'Study'. Tarn left it for me.
    audio_ru: null
    audio_en: null
  - line_id: DLG-GATE-010
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Пальто сухое. А лента помнит ночь.
    text_en: The coat is dry. And the tape remembers the night.
    audio_ru: null
    audio_en: null
  - line_id: DLG-GATE-011
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Ходики. Идут.
    text_en: A wall clock. Still going.
    audio_ru: null
    audio_en: null
  - line_id: DLG-ALLEY-001
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Фонтан с совой. У каждой чаши свой знак.
    text_en: A fountain with an owl. Each bowl has its own sign.
    audio_ru: null
    audio_en: null
  - line_id: DLG-ALLEY-002
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Вода стоит вровень со сливом. Дождь её не сбил.
    text_en: The water sits level with the overflow hole. The rain hasn't changed it.
    audio_ru: null
    audio_en: null
  - line_id: DLG-ALLEY-003
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Полна через край. Когда её вылили в последний раз?
    text_en: Full to overflowing. When was it last emptied?
    audio_ru: null
    audio_en: null
  - line_id: DLG-ALLEY-004
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Ни ручки, ни скважины. Заперто изнутри?
    text_en: No handle, no keyhole. Bolted from inside?
    audio_ru: null
    audio_en: null
  - line_id: DLG-ALLEY-005
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Дом подождёт. Сначала найду ключ от кабинета.
    text_en: The house can wait. First I'll find the key to the study.
    audio_ru: null
    audio_en: null
  - line_id: DLG-ALLEY-006
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Ключ у меня. Теперь — кабинет.
    text_en: I have the key. Now for the study.
    audio_ru: null
    audio_en: null
  - line_id: DLG-ALLEY-007
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: В доме меня ждут. Но снаружи я ещё не всё проверила.
    text_en: They're waiting for me in the house. But I haven't checked everything out here yet.
    audio_ru: null
    audio_en: null
  - line_id: DLG-ALLEY-008
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Сад подождёт. Сначала — ворота и озеро.
    text_en: The garden can wait. The gate and the lake first.
    audio_ru: null
    audio_en: null
  - line_id: DLG-ALLEY-009
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Мокрый гравий. У самого дома всё затоптано.
    text_en: Wet gravel. Trampled all over near the house.
    audio_ru: null
    audio_en: null
  - line_id: DLG-ALLEY-010
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Кто-то принёс пальто к озеру. Тропа должна это помнить.
    text_en: Someone brought that coat down to the lake. The path should remember.
    audio_ru: null
    audio_en: null
  - line_id: DLG-ALLEY-011
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Пойду по траве. Гравий пусть останется как есть.
    text_en: I'll keep to the grass. Best leave the gravel as it is.
    audio_ru: null
    audio_en: null
  - line_id: DLG-ALLEY-012
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Дверь кабинета на террасу. Заперто. Постель в алькове не тронута.
    text_en: The study's terrace door. Locked. The bed in the alcove hasn't been slept in.
    audio_ru: null
    audio_en: null
  - line_id: DLG-PIER-001
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Туман над водой. А в конце мостков — пальто.
    text_en: Mist over the water. And at the end of the pier, a coat.
    audio_ru: null
    audio_en: null
  - line_id: DLG-PIER-002
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Навесной замок. А ключа у меня нет.
    text_en: A padlock. And I have no key.
    audio_ru: null
    audio_en: null
  - line_id: LOGIC-GATE-01
    speaker_id: CLARA
    style: thought
    status: approved
    params:
    - pillars
    - levels
    template_ru: '{pillars} — по столбам слева направо. В их чашах вода на {levels}.'
    template_en: '{pillars} — the pillars, left to right. Their bowls hold water at {levels}.'
    text_ru: Луна, Сова, Шестерня, Ключ — по столбам слева направо. В их чашах вода на трёх, семи, пяти и шести.
    text_en: Moon, Owl, Gear, Key — the pillars, left to right. Their bowls hold water at three, seven, five and six.
    audio_ru: null
    audio_en: null
  - line_id: FB-GATE01-E1
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Цифры те, что в чашах. А порядок? Барабаны стоят в ряд, как что-то у ворот.
    text_en: The numbers are the ones in the bowls. But the order? The drums stand in a row, like something at the gate.
    audio_ru: null
    audio_en: null
  - line_id: FB-GATE01-E2
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Таких уровней воды в чашах нет. Над барабанами нарисованы чаши, а не номера знаков.
    text_en: No bowl has water at those levels. The engraving above the drums shows bowls, not sign numbers.
    audio_ru: null
    audio_en: null
  - line_id: FB-GATE01-E3
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Не все эти цифры есть в чашах фонтана.
    text_en: Not all of these numbers are in the fountain's bowls.
    audio_ru: null
    audio_en: null
  - line_id: FB-GATE01-E4
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Над барабанами — столбики с чашами. Порядок задают они.
    text_en: 'Above the drums: little pillars with bowls. They set the order.'
    audio_ru: null
    audio_en: null
  - line_id: FB-GATE01-N1
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Цифры, кажется, правильные. Что-то с порядком.
    text_en: The numbers look right. Something's off with the order.
    audio_ru: null
    audio_en: null
  - line_id: FB-GATE01-N2
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Над барабанами нарисованы чаши. При чём тут номера знаков?
    text_en: There are bowls drawn above the drums. Why would sign numbers come into it?
    audio_ru: null
    audio_en: null
  - line_id: FB-GATE01-N3
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Не сходится с фонтаном.
    text_en: That doesn't match the fountain.
    audio_ru: null
    audio_en: null
  - line_id: LOGIC-PIER-01
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Сверху сухое, снизу подмокло. Его положили на мокрые доски, когда дождь уже кончился.
    text_en: Dry on top, damp underneath. It was laid on the wet boards after the rain had stopped.
    audio_ru: null
    audio_en: null
  - line_id: LOGIC-ALLEY-01
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: 'Края острые, воды в отпечатках нет — как в утренней колее. Кто-то прошёл после дождя: к мосткам и обратно.'
    text_en: 'Sharp edges, no water in the prints — just like this morning''s tyre ruts. Someone walked here after the rain: down to the pier and back.'
    audio_ru: null
    audio_en: null
  - line_id: LOGIC-GATE-02
    speaker_id: CLARA
    style: thought
    status: approved
    params:
    - rain_end_words
    text_ru: 'Лента: ночной дождь кончился около {rain_end_words}. А верх пальто сухой — под дождём оно не лежало. Его принесли потом.'
    text_en: 'The tape: the night rain stopped at around {rain_end_words}. But the top of the coat is dry — it never lay out in the rain. It was brought later.'
    audio_ru: null
    audio_en: null
  - line_id: LOGIC-GATE-03
    speaker_id: CLARA
    style: thought
    status: approved
    params:
    - departure
    - duration
    - arrival
    template_ru: '{departure} и ещё {duration} в пути — поезд пришёл в {arrival}. Тарн ждал меня.'
    template_en: '{departure}, plus {duration} on the way — the train got in at {arrival}. Tarn was expecting me.'
    text_ru: Без пяти семь и ещё два сорок пять в пути — поезд пришёл в девять сорок. Тарн ждал меня.
    text_en: Six fifty-five, plus two hours forty-five on the way — the train got in at nine forty. Tarn was expecting me.
    audio_ru: null
    audio_en: null
  - line_id: HINT-WAIT-01
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Так, надо подумать… Дай мне пару минут.
    text_en: Right, let me think… Give me a couple of minutes.
    audio_ru: null
    audio_en: null
  - line_id: HINT-WAIT-02
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Не спешить. Пройдусь ещё раз — мысль догонит.
    text_en: No rushing. I'll take another look round — the thought will catch up.
    audio_ru: null
    audio_en: null
  - line_id: HINT-WAIT-03
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Что-то я упустила. Сейчас вспомню.
    text_en: I've missed something. It'll come to me.
    audio_ru: null
    audio_en: null
  - line_id: HINT-WAIT-BUSY
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Я ещё думаю. Пока посмотрю вокруг.
    text_en: Still thinking. I'll look around meanwhile.
    audio_ru: null
    audio_en: null
  - line_id: HINT-READY-01
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Вот. Кажется, я поняла, куда дальше.
    text_en: There. I think I know where to go next.
    audio_ru: null
    audio_en: null
  - line_id: HINT-SELF-01
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: А, уже не нужно. Сама разобралась.
    text_en: Ah, never mind. I've worked it out myself.
    audio_ru: null
    audio_en: null
  - line_id: HINT-EX-01
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Ворота видят всех, кто уходит ночью. Сначала осмотрю сторожку.
    text_en: The gate sees everyone who leaves at night. I'll search the gatehouse first.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-GATE01-A2
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Ворота видят всех. Сначала — сторожка.
    text_en: The gate sees everyone. The gatehouse first.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-GATE01-P1
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Дверь сторожки на кодовом замке. Надо понять, откуда цифры.
    text_en: The gatehouse has a combination lock. Where do its numbers come from?
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-GATE01-P2
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Сторожка заперта на код. Тарн любил загадки для гостей.
    text_en: The gatehouse is locked with a code. Tarn liked setting puzzles for his guests.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-GATE01-R
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Для этого замка у меня всё есть. Подумаю ещё раз.
    text_en: I have all I need for this lock. Let me think again.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-GATE01-M
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Мне чего-то не хватает. Я ещё не всё осмотрела у ворот и на аллее.
    text_en: Something's missing. I haven't looked around the gate and the drive yet.
    audio_ru: null
    audio_en: null
  - line_id: HINT-EX-02
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Кабинет заперт. А запасные ключи обычно держат там, где сторожат ворота.
    text_en: The study is locked. Spare keys are usually kept wherever the gate is watched.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-GATE03-A2
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Запасной ключ где-то есть. Феликс говорил про ящик.
    text_en: There's a spare key somewhere. Felix mentioned a box.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-GATE03-P1
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Ящик с ключами в сторожке. Какое время он ждёт?
    text_en: The key box in the gatehouse. What time is it waiting for?
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-GATE03-P2
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Часовой замок на ящике. Для кого Тарн его настроил?
    text_en: A clock lock on the box. Who did Tarn set it for?
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-GATE03-R
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Всё, что нужно, у меня с собой. Подумаю ещё.
    text_en: I've got everything I need with me. Let me think again.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-GATE03-M
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Сначала надо попасть в сторожку.
    text_en: First I need to get into the gatehouse.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-PIER01-A1
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Марта говорила о пальто у озера.
    text_en: Martha mentioned a coat by the lake.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-PIER01-A2
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Пальто на мостках. Я ещё не разглядела его как следует.
    text_en: The coat on the pier. I haven't had a proper look at it yet.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-PIER01-P1
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Мостки. Надо осмотреть всё, что там лежит.
    text_en: The pier. I should check everything lying there.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-PIER01-P2
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Пальто на мостках. Надо осмотреть и его, и всё вокруг.
    text_en: The coat on the pier. I should examine it, and everything around it.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-PIER01-R
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Я ещё не всё отметила на мостках.
    text_en: I haven't marked everything on the pier yet.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-ALLEY01-A1
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Кто-то принёс пальто к озеру. Не по воздуху же.
    text_en: Someone brought the coat to the lake. It didn't fly there.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-ALLEY01-A2
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Тропа к озеру. Гравий мог что-то сохранить.
    text_en: The path to the lake. The gravel may have kept something.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-ALLEY01-P1
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Гравий у развилки к озеру. Что на нём осталось?
    text_en: The gravel at the fork to the lake. What's been left on it?
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-ALLEY01-P2
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Развилка у фонтана. Надо присмотреться к гравию.
    text_en: The fork by the fountain. I should take a closer look at the gravel.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-ALLEY01-R
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Всё, что нужно, — на гравии у развилки.
    text_en: Everything I need is in the gravel at the fork.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-ALLEY01-M
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Сначала — пальто на мостках.
    text_en: The coat on the pier first.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-GATE02-A1
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Пальто сухое. А какой была ночь? Тарн записывал погоду.
    text_en: The coat is dry. But what was the night like? Tarn kept track of the weather.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-GATE02-A2
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: В сторожке есть самописец погоды. Что он помнит о той ночи?
    text_en: There's a weather recorder in the gatehouse. What does it remember about that night?
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-GATE02-P1
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Самописец погоды в сторожке. Когда пальто попало на мостки?
    text_en: The weather recorder in the gatehouse. When did the coat get to the pier?
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-GATE02-P2
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Лента в сторожке помнит ночь. А пальто — когда его положили?
    text_en: The tape in the gatehouse remembers the night. And the coat — when was it put there?
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-GATE02-R
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Всё нужное у меня в блокноте. Подумаю ещё раз.
    text_en: Everything I need is in my notebook. Let me think again.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-GATE02-M
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Сначала надо взглянуть на пальто у озера.
    text_en: First I should take a look at the coat by the lake.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-END-A1
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Ключ от кабинета у меня. Пора в дом.
    text_en: I have the study key. Time to go in.
    audio_ru: null
    audio_en: null
  - line_id: HINT-NAV-END-P1
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Парадная дверь у фонтана. Кабинет Тарна ждёт.
    text_en: The front door, past the fountain. Tarn's study is waiting.
    audio_ru: null
    audio_en: null
  - line_id: FB-PIER01-E1
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Круг, но без бугорка посередине. Не то.
    text_en: Round, but no bump in the middle. Not that.
    audio_ru: null
    audio_en: null
  - line_id: FB-PIER01-E2
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Рукавов у брезента нет.
    text_en: A tarpaulin doesn't have sleeves.
    audio_ru: null
    audio_en: null
  - line_id: FB-PIER01-E3
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Брезент тёмный весь, а тут тёмная только полоса внизу.
    text_en: The tarpaulin is dark all over. Here, only a strip along the bottom is dark.
    audio_ru: null
    audio_en: null
  - line_id: FB-PIER01-E4
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Силуэт — не вся вещь, а только край ткани.
    text_en: The outline isn't the whole thing, only the edge of the cloth.
    audio_ru: null
    audio_en: null
  - line_id: FB-PIER01-E5
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: У пера нет лопастей.
    text_en: A feather doesn't have lobes.
    audio_ru: null
    audio_en: null
  - line_id: FB-PIER01-N1
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Не то.
    text_en: Not that.
    audio_ru: null
    audio_en: null
  - line_id: FB-ALLEY01-E1
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: В этих стоит вода, края оплыли. Дождь по ним прошёл.
    text_en: These hold water, and their edges have slumped. The rain has been over them.
    audio_ru: null
    audio_en: null
  - line_id: FB-ALLEY01-E2
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Это колея от шин. Мне нужны шаги.
    text_en: Those are tyre ruts. I'm after footsteps.
    audio_ru: null
    audio_en: null
  - line_id: FB-ALLEY01-E3
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Здесь всё истоптано. Ничего не разобрать.
    text_en: It's all trampled here. Nothing to make out.
    audio_ru: null
    audio_en: null
  - line_id: FB-ALLEY01-E4
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Я отметила не все свежие следы.
    text_en: I haven't marked all the fresh prints.
    audio_ru: null
    audio_en: null
  - line_id: FB-ALLEY01-E5
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Следы верные. Где у них пятка, а где носок?
    text_en: The right prints. But which end is the heel, and which the toe?
    audio_ru: null
    audio_en: null
  - line_id: FB-GATE02-E1
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Это не та часть ленты. Мне нужно, что было ночью.
    text_en: Wrong part of the tape. I need what happened in the night.
    audio_ru: null
    audio_en: null
  - line_id: FB-GATE02-E2
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Подмокло от досок — значит, доски были мокрыми. А лежало ли оно под дождём?
    text_en: It got damp from the boards, so the boards were wet. But did it ever lie out in the rain?
    audio_ru: null
    audio_en: null
  - line_id: FB-GATE02-E3
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Это говорит, что дождь был. А про пальто?
    text_en: That tells me it rained. But what about the coat?
    audio_ru: null
    audio_en: null
  - line_id: FB-GATE02-E4
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Сложено аккуратно. Но о дожде тут ничего.
    text_en: Neatly folded. But nothing here about the rain.
    audio_ru: null
    audio_en: null
  - line_id: FB-GATE02-E5
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Фрагменты верные. Вывод с ними не сходится.
    text_en: The right pieces. The conclusion doesn't fit them.
    audio_ru: null
    audio_en: null
  - line_id: FB-GATE03-E1
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Это когда поезд ушёл. А гость с поезда появляется позже.
    text_en: That's when the train left. The guest off the train turns up later.
    audio_ru: null
    audio_en: null
  - line_id: FB-GATE03-E2
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Это сколько ехать, а не который час.
    text_en: That's how long the journey takes, not what time it is.
    audio_ru: null
    audio_en: null
  - line_id: FB-GATE03-E3
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: 'Почти. Пересчитаю: отправление плюс дорога.'
    text_en: 'Almost. Let me add it up again: departure plus the journey.'
    audio_ru: null
    audio_en: null
  - line_id: FB-GATE03-E4
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Ящик ждал гостя с поезда, а не "сейчас".
    text_en: The box was waiting for the guest off the train, not for 'now'.
    audio_ru: null
    audio_en: null
  - line_id: FB-GATE03-N1
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Гость с поезда… когда он здесь?
    text_en: The guest off the train… when do they get here?
    audio_ru: null
    audio_en: null
  - line_id: FB-GATE03-N2
    speaker_id: CLARA
    style: thought
    status: approved
    text_ru: Пересчитаю ещё раз.
    text_en: I'll work it out again.
    audio_ru: null
    audio_en: null
